<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ingrid SOW — Sign in</title>
<link rel="stylesheet" href="sow.css" />
<script>
  // TODO: Replace with your Supabase project values
  window.SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
  window.SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
</script>
<script src="api.js"></script>
<style>
  html, body { margin: 0; min-height: 100vh; }
  body {
    font-family: var(--font-sans);
    background: #E7E3DD;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    width: 400px;
    max-width: 100%;
    background: #fff;
    border-radius: 14px;
    box-shadow: var(--shadow-pop);
    padding: 40px 36px 36px;
  }
  .login-logo {
    display: block;
    margin-bottom: 28px;
  }
  .login-logo img { height: 24px; }
  .login-heading {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 28px;
    letter-spacing: -0.015em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .login-sub {
    font-size: 14px;
    color: var(--mute);
    margin: 0 0 28px;
  }
  .login-field {
    margin-bottom: 14px;
  }
  .login-label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 6px;
  }
  .login-field .ctl-text {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink);
    background: var(--lavender-light-50);
    border: 1px solid var(--lavender-light);
    border-radius: 8px;
    padding: 11px 13px;
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
    box-sizing: border-box;
  }
  .login-field .ctl-text::placeholder { color: #bdb8b0; }
  .login-field .ctl-text:focus {
    border-color: var(--lavender);
    background-color: #fff;
    box-shadow: 0 0 0 3px var(--lavender-light);
  }
  .login-btn {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    padding: 13px 20px;
    border-radius: 999px;
    margin-top: 22px;
    transition: background .15s;
  }
  .login-btn:hover { background: #2a2a2a; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-error {
    margin-top: 16px;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #B03030;
    font-size: 13.5px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  .login-error.show { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="assets/ingrid-wordmark-black.svg" alt="Ingrid" />
  </div>
  <h1 class="login-heading">Sign in to Ingrid SOW</h1>
  <p class="login-sub">For Ingrid team members only. Enter your Ingrid credentials below.</p>

  <form id="loginForm" novalidate>
    <div class="login-field">
      <label class="login-label" for="email">Email</label>
      <input class="ctl-text" type="email" id="email" name="email" placeholder="you@ingrid.com" autocomplete="email" required />
    </div>
    <div class="login-field">
      <label class="login-label" for="password">Password</label>
      <input class="ctl-text" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button class="login-btn" type="submit" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </form>
</div>

<script>
  (function () {
    // If already signed in, skip to dashboard
    if (SowAPI.restoreSession()) {
      window.location.href = 'dashboard.html';
      return;
    }

    var form = document.getElementById('loginForm');
    var btn = document.getElementById('loginBtn');
    var errEl = document.getElementById('loginError');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) return;

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errEl.classList.remove('show');

      SowAPI.login(email, password).then(function () {
        window.location.href = 'dashboard.html';
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        var msg = (err && (err.error_description || err.message)) || 'Invalid email or password.';
        errEl.textContent = msg;
        errEl.classList.add('show');
      });
    });
  })();
</script>
</body>
</html>
